<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini SPA Project</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <span class="font-bold text-xl tracking-tight">SpaceExplorer</span>
      <div class="space-x-6">
        <button data-route="about" class="nav-btn hover:text-indigo-200 font-medium underline">About</button>
        <button data-route="topics" class="nav-btn hover:text-indigo-200 font-medium">Topics</button>
        <button data-route="contact" class="nav-btn hover:text-indigo-200 font-medium">Contact</button>
      </div>
    </div>
  </nav>

  <!-- Dynamic Content Container -->
  <main id="app" class="flex-grow max-w-5xl mx-auto w-full px-4 py-10">
    <!-- Components render here dynamically -->
  </main>

  <!-- App Entry Point -->
  <script type="module" src="./app.js"></script>
</body>
</html>
